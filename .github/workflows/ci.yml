name: Pedigree Risk Calculator CI/CD & Security Verification

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test-and-audit:
    runs-on: ubuntu-latest
    env:
      AUDIT_SECRET_KEY: test-ci-audit-signing-key-not-for-production
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Pytest Suite
      run: |
        pytest -v

    - name: Check Python syntax and Mendelian CLI
      run: |
        python -m compileall -q agents pedigree.py inheritance.py cli.py
        python pedigree.py risk --inheritance autosomal_recessive --mother Aa --father Aa

    - name: Check browser calculator
      run: node --test web/test-risk.mjs

    - name: Security smoke checks (not a comprehensive SAST scan)
      run: |
        python -c "
        from agents.base import PHIGuard, AuditLogger
        import pytest
        assert AuditLogger.verify_integrity() is True
        print('Security & Zero-PHI Audit Passed!')
        "
