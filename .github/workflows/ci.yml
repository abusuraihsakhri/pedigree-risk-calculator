name: Pedigree Risk Calculator CI/CD & Security Verification

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test-and-audit:
    runs-on: ubuntu-latest
    env:
      AUDIT_SECRET_KEY: test-ci-audit-signing-key-not-for-production
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Pytest Suite
      run: |
        pytest -v

    - name: Check Python syntax and Mendelian CLI
      run: |
        python -m compileall -q agents pedigree.py inheritance.py cli.py
        python pedigree.py risk --inheritance autosomal_recessive --mother Aa --father Aa

    - name: Check browser calculator
      run: node --test web/test-risk.mjs

    - name: PHI-pattern and HMAC chain smoke test
      run: |
        python - <<'PY'
        from agents.base import PHIGuard, AuditLogger, SecurityException
        try:
            PHIGuard.assert_no_phi("Patient MRN-994827 test")
        except SecurityException:
            pass
        else:
            raise AssertionError("Expected MRN pattern to be blocked")
        AuditLogger.log("ci", "test", "CHECK", {"ok": True})
        assert AuditLogger.verify_integrity()
        PY
